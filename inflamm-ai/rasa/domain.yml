version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - health_concern
  - symptom_headache
  - symptom_fever
  - symptom_cough
  - symptom_pain
  - ask_medical_advice
  - ask_emergency
  - ask_appointment
  - ask_medication
  - ask_exercise
  - ask_nutrition
  - ask_sleep
  - ask_stress
  - thank
  - out_of_scope

entities:
  - symptom
  - body_part
  - severity
  - duration
  - medication
  - condition

slots:
  symptom:
    type: text
    influence_conversation: true
  body_part:
    type: text
    influence_conversation: true
  severity:
    type: text
    influence_conversation: true
  duration:
    type: text
    influence_conversation: true

responses:
  utter_greet:
  - text: "Hello! I'm your health assistant. How can I help you today? 💙"

  utter_goodbye:
  - text: "Take care of yourself! Remember to prioritize your health. Goodbye! 👋"

  utter_thank:
  - text: "You're welcome! I'm here to help you on your health journey. 🌟"

  utter_health_concern:
  - text: "I understand you're concerned about your health. I'm here to help. Can you tell me more about what you're experiencing?"

  utter_symptom_headache:
  - text: "I understand headaches can be really uncomfortable. While I can't diagnose, here are some general tips: 💧 Stay hydrated, 😴 Get enough sleep, 🧘‍♀️ Try relaxation techniques. If headaches are severe or persistent, please see a healthcare provider. How long have you been experiencing these?"

  utter_symptom_fever:
  - text: "Fever is your body's way of fighting infection. 🌡️ Rest and stay hydrated. If fever is above 103°F (39.4°C) or lasts more than 3 days, please seek medical care. Are you experiencing any other symptoms?"

  utter_symptom_cough:
  - text: "Coughing can be uncomfortable. 💧 Try warm fluids, 🍯 Honey may help soothe your throat. If cough is severe, lasts more than a week, or you have difficulty breathing, please see a doctor. How long have you had this cough?"

  utter_symptom_pain:
  - text: "I understand you're experiencing pain. While I can't diagnose, gentle movement, 🧊 cold/warm compresses, and rest may help. If pain is severe, sudden, or concerning, please seek immediate medical attention. Where exactly are you feeling this pain?"

  utter_ask_medical_advice:
  - text: "I'm here to provide general health information, but I'm not a medical professional. For personalized medical advice, please consult with a healthcare provider. Is there a specific health topic you'd like general information about?"

  utter_ask_emergency:
  - text: "🚨 If you're experiencing a medical emergency, please call emergency services (911) or go to the nearest emergency room immediately. Don't wait! Signs of emergency include: difficulty breathing, chest pain, severe bleeding, confusion, or loss of consciousness."

  utter_ask_appointment:
  - text: "That's a great step for your health! 📅 You can schedule appointments by calling your healthcare provider directly, using their patient portal, or visiting their website. Many providers now offer telehealth options too."

  utter_ask_medication:
  - text: "I can't provide specific medication advice as that requires medical evaluation. 💊 Always consult with your healthcare provider or pharmacist about medications. They can consider your full health history and current medications."

  utter_ask_exercise:
  - text: "🏃‍♀️ Regular exercise is great for health! Aim for 150 minutes of moderate activity weekly. This could be walking, swimming, cycling, or dancing. Always start slowly and listen to your body. What type of exercise interests you?"

  utter_ask_nutrition:
  - text: "🥗 Good nutrition is foundational! Focus on whole foods, fruits, vegetables, lean proteins, and healthy fats. 🚰 Drink plenty of water. Consider consulting a registered dietitian for personalized nutrition advice. What specific nutrition questions do you have?"

  utter_ask_sleep:
  - text: "😴 Quality sleep is crucial! Aim for 7-9 hours nightly. Tips: maintain a consistent schedule, 🌙 create a relaxing bedtime routine, avoid screens before bed, and keep your bedroom cool and dark. How's your current sleep quality?"

  utter_ask_stress:
  - text: "🧘‍♀️ Managing stress is important for overall health! Try deep breathing, meditation, regular exercise, or talking with someone you trust. If stress feels overwhelming, consider speaking with a mental health professional. What stress management techniques have you tried?"

  utter_emergency_check:
  - text: "Before we continue, are you experiencing any emergency symptoms like difficulty breathing, chest pain, severe bleeding, or loss of consciousness? 🚨"

  utter_medical_disclaimer:
  - text: "💙 Remember, I'm here to provide general health information and support, but I'm not a substitute for professional medical care. Always consult with healthcare providers for diagnosis and treatment."

  utter_default:
  - text: "I want to help, but I'm not sure I understand. Could you tell me more about your health question or concern? I'm here to listen and provide general guidance."

actions:
  - action_emergency_check
  - action_medical_disclaimer

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
