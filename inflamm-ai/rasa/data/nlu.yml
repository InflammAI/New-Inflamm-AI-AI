version: "3.1"

nlu:
- intent: greet
  examples: |
    - hello
    - hi
    - hey
    - good morning
    - good afternoon
    - greetings

- intent: goodbye
  examples: |
    - goodbye
    - bye
    - see you later
    - farewell
    - exit

- intent: thank
  examples: |
    - thank you
    - thanks
    - appreciate it
    - helpful
    - great advice

- intent: health_concern
  examples: |
    - I'm worried about my health
    - I have a health question
    - I need health advice
    - I'm concerned about symptoms
    - Can you help with my health?

- intent: symptom_headache
  examples: |
    - I have a headache
    - my head hurts
    - headache pain
    - migraine
    - head is pounding

- intent: symptom_fever
  examples: |
    - I have a fever
    - I'm running a fever
    - my temperature is high
    - I feel feverish
    - I think I have a fever

- intent: symptom_cough
  examples: |
    - I have a cough
    - I'm coughing
    - persistent cough
    - dry cough
    - chesty cough

- intent: symptom_pain
  examples: |
    - I'm in pain
    - it hurts
    - pain in my [body_part](chest)
    - sharp pain
    - dull ache in my [body_part](back)

- intent: ask_medical_advice
  examples: |
    - What should I do?
    - Can you give me medical advice?
    - What treatment do you recommend?
    - Should I see a doctor?
    - What's wrong with me?

- intent: ask_emergency
  examples: |
    - Is this an emergency?
    - Should I go to ER?
    - emergency room
    - 911
    - urgent care

- intent: ask_appointment
  examples: |
    - How do I make an appointment?
    - schedule appointment
    - doctor appointment
    - see a doctor
    - book appointment

- intent: ask_medication
  examples: |
    - What medicine should I take?
    - medication advice
    - prescription
    - over the counter
    - drugs

- intent: ask_exercise
  examples: |
    - What exercise should I do?
    - workout advice
    - fitness routine
    - physical activity
    - exercise recommendations

- intent: ask_nutrition
  examples: |
    - What should I eat?
    - diet advice
    - nutrition tips
    - healthy eating
    - food recommendations

- intent: ask_sleep
  examples: |
    - How can I sleep better?
    - sleep advice
    - insomnia
    - sleep problems
    - rest tips

- intent: ask_stress
  examples: |
    - How do I manage stress?
    - stress relief
    - anxiety
    - feeling overwhelmed
    - coping mechanisms

- intent: out_of_scope
  examples: |
    - What's the weather?
    - Tell me a joke
    - Who won the game?
    - Politics
    - Entertainment news

rules:
- rule: Greet user
  steps:
  - intent: greet
  - action: utter_greet

- rule: Say goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Thank user
  steps:
  - intent: thank
  - action: utter_thank

- rule: Handle health concern
  steps:
  - intent: health_concern
  - action: utter_emergency_check
  - action: utter_health_concern

- rule: Handle headache
  steps:
  - intent: symptom_headache
  - action: utter_emergency_check
  - action: utter_symptom_headache

- rule: Handle fever
  steps:
  - intent: symptom_fever
  - action: utter_emergency_check
  - action: utter_symptom_fever

- rule: Handle cough
  steps:
  - intent: symptom_cough
  - action: utter_emergency_check
  - action: utter_symptom_cough

- rule: Handle pain
  steps:
  - intent: symptom_pain
  - action: utter_emergency_check
  - action: utter_symptom_pain

- rule: Handle medical advice request
  steps:
  - intent: ask_medical_advice
  - action: utter_medical_disclaimer
  - action: utter_ask_medical_advice

- rule: Handle emergency question
  steps:
  - intent: ask_emergency
  - action: utter_ask_emergency

- rule: Handle appointment question
  steps:
  - intent: ask_appointment
  - action: utter_ask_appointment

- rule: Handle medication question
  steps:
  - intent: ask_medication
  - action: utter_medical_disclaimer
  - action: utter_ask_medication

- rule: Handle exercise question
  steps:
  - intent: ask_exercise
  - action: utter_ask_exercise

- rule: Handle nutrition question
  steps:
  - intent: ask_nutrition
  - action: utter_ask_nutrition

- rule: Handle sleep question
  steps:
  - intent: ask_sleep
  - action: utter_ask_sleep

- rule: Handle stress question
  steps:
  - intent: ask_stress
  - action: utter_ask_stress

- rule: Handle out of scope
  steps:
  - intent: out_of_scope
  - action: utter_default
