version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: vitalsync_db
    environment:
      POSTGRES_USER: vitalsync_user
      POSTGRES_PASSWORD: vitalsync_secure_password_123
      POSTGRES_DB: vitalsync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalsync_user -d vitalsync_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vitalsync_network

  # Node.js Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vitalsync_backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: vitalsync_user
      DB_PASSWORD: vitalsync_secure_password_123
      DB_NAME: vitalsync_db
      JWT_SECRET: your_secure_jwt_secret_key_change_in_production
      JWT_REFRESH_SECRET: your_secure_refresh_secret_key_change_in_production
      ENCRYPTION_KEY: your_secure_encryption_key_32_chars
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - /app/node_modules
    networks:
      - vitalsync_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  vitalsync_network:
    driver: bridge
